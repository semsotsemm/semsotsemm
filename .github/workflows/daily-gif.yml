name: Daily profile GIF

on:
  schedule:
    # 21:17 UTC = 00:17 Europe/Moscow on the following day.
    # Avoid the busiest start-of-hour scheduling window.
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/daily-gif.yml'

permissions:
  contents: write

concurrency:
  group: daily-profile-gif
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test weekday selection and safe README edits
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select today's animation (Europe/Moscow)
        run: python3 .github/scripts/update_daily_gif.py
      - name: Commit only when the animation changes
        run: |
          if git diff --quiet -- README.md; then
            echo "The correct GIF is already selected."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'chore: update daily profile GIF'
          git push
